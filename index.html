<!DOCTYPE html>
<html lang="pt-BR"
  style="background-color: #bb9898; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com?plugins=typography,container-queries"></script>
  <title>Lanchonete do Betão</title>

</head>
<style>
  .btn:hover {
    background-color: #020101;
    box-shadow: 0 0 10px 0 #020101;
    color: aliceblue;
  }

  .card {
    background-color: rgb(205, 227, 247);
    width: 250px;
    height: 250px;
    border-radius: 20px;
    box-shadow: 0 0 10px 0 #000000;
  }
</style>


<body>
  <div class="flex flex-col items-center justify-center mt-[330px] px-4">
    <button class="btn p-5 font-semibold text-white shadow-lg" style="background-color: #912c2c; border-radius: 20px;"
      onclick="window.location.reload()">
      ▶ Reiniciar Atendimento
    </button>

    <div class="card mt-[10px] w-[400px] h-[350px]">
      <h1 class=" text-center text-2xl pt-5 pb-5">Informações</h1>
      <p class="text-center mb-4" style="font-weight: bold;">Acesse o betão no F12 e peça sua comidinha :D</p>
      <img class=" mx-auto mt-2" src="./img/image.png" alt="" width="300px" height="100px"
        style=" filter: drop-shadow(0px 0px 10px #000); box-shadow: 0px 0px 10px #912c2c; border-radius: 10px;">
    </div>


    <!-- Carregamento do código principal com módulos -->

    <script type="module" src="./main.js"></script>
</body>


</html>
