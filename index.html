<!DOCTYPE html>
<html lang="pt-BR"
  style="background-color: #e0d9d9; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="mt-[300px] ">

    <img class=" mx-auto mt-2" src="./img/image.png" alt="" width="300px" height="100px"
